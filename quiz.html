<style>

    .pagina-quiz {
        max-width: 720px;
        margin: 80px auto;
        padding: 0 24px;
    }

    .quiz-cabecalho {
        text-align: center;
        margin-bottom: 40px;
    }

    .quiz-cabecalho h1 {
        color: #FFFFFF;
        font-size: 44px;
        font-weight: 700;
        margin-bottom: 14px;
    }

    .quiz-cabecalho p {
        color: #9D9D9D;
        font-size: 18px;
        line-height: 1.6;
    }

    /* ---------- FILTRO DE CATEGORIAS ----------
       Gerado dinamicamente pelo JS (função carregarCategorias),
       com um botão por tag encontrada em QUESTOES.
       Reaproveita a mesma linguagem visual das pílulas de
       categoria já usadas no Pixel Feed (.categoria-feed). */

    .quiz-categorias {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-bottom: 32px;
    }

    .categoria-filtro {
        border: 1px solid #222;
        background: transparent;
        padding: 8px 18px;
        border-radius: 30px;
        color: #999;
        font-family: "Pixelify Sans", sans-serif;
        font-size: 14px;
        cursor: pointer;
        transition: .25s;
    }

    .categoria-filtro:hover {
        border-color: #FA397A;
        color: #fff;
    }

    .categoria-filtro.ativa {
        color: #fff;
        border-color: #FA397A;
        background-color: #FA397A;
    }

    /* ---------- CARD DA PERGUNTA ---------- */

    .quiz-card {
        background: #080808;
        border: 1px solid #161616;
        border-radius: 16px;
        padding: 32px;
    }

    .quiz-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .quiz-tag {
        display: inline-block;
        border: 1px solid #FA397A;
        color: #FA397A;
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-family: "Pixelify Sans", sans-serif;
    }

    .quiz-pergunta {
        color: #fff;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.4;
        margin-bottom: 28px;
    }

    .quiz-respostas {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .quiz-resposta {
        display: block;
        width: 100%;
        text-align: left;
        background: #131313;
        border: 1px solid #2A2A2A;
        border-radius: 10px;
        padding: 16px 20px;
        color: #E5E5E5;
        font-size: 16px;
        font-family: "Segoe UI", sans-serif;
        cursor: pointer;
        transition: .2s;
    }

    .quiz-resposta:hover:not(:disabled) {
        border-color: #FA397A;
    }

    .quiz-resposta:disabled {
        cursor: default;
    }

    .quiz-resposta.correta {
        background: rgba(47, 190, 122, 0.15);
        border-color: #2FBE7A;
        color: #fff;
    }

    .quiz-resposta.errada {
        background: rgba(250, 57, 57, 0.12);
        border-color: #FA3939;
        color: #fff;
    }

    .quiz-feedback {
        margin-top: 24px;
        padding: 18px 20px;
        border-radius: 10px;
        background: #111;
        color: #B5B5B5;
        font-size: 15px;
        line-height: 1.6;
        display: none;
    }

    .quiz-feedback.visivel {
        display: block;
    }

    .quiz-rodape-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 28px;
        flex-wrap: wrap;
        gap: 16px;
    }

    .quiz-progresso {
        color: #777;
        font-size: 14px;
    }

    .botao-proxima {
        display: none;
        background: #FA397A;
        color: #000;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: .25s;
    }

    .botao-proxima.visivel {
        display: inline-block;
    }

    .botao-proxima:hover {
        opacity: .85;
    }

    /* ---------- TELA FINAL DO QUIZ ---------- */

    .quiz-fim {
        text-align: center;
        padding: 20px 0;
    }

    .quiz-fim h2 {
        color: #FA397A;
        font-size: 28px;
        margin-bottom: 12px;
    }

    .quiz-fim p {
        color: #B5B5B5;
        font-size: 16px;
        margin-bottom: 24px;
    }

    .quiz-fim-stats {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 32px;
    }

    .stat-item {
        background: #131313;
        border: 1px solid #2A2A2A;
        border-radius: 10px;
        padding: 18px 26px;
        min-width: 120px;
    }

    .stat-numero {
        display: block;
        color: #fff;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .stat-legenda {
        display: block;
        color: #999;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .quiz-fim-botoes {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
    }

    .botao-refazer,
    .botao-outra-categoria {
        border-radius: 8px;
        padding: 12px 24px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: .25s;
        font-family: "Segoe UI", sans-serif;
    }

    .botao-refazer {
        background: #FA397A;
        color: #000;
        border: none;
    }

    .botao-refazer:hover {
        opacity: .85;
    }

    .botao-outra-categoria {
        background: transparent;
        color: #FA397A;
        border: 2px solid #FA397A;
    }

    .botao-outra-categoria:hover {
        background: #FA397A;
        color: #000;
    }

    /* ---------- ÍCONE DISCRETO: COMPARTILHAR NO LINKEDIN ----------
       Fica pequeno e discreto, abaixo dos botões principais da
       tela final — não é um botão grande, só um ícone clicável. */

    .compartilhar-linkedin-discreto {
        display: flex;
        justify-content: center;
        margin-top: 22px;
    }

    .icone-linkedin {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: transparent;
        border: none;
        cursor: pointer;
        opacity: .55;
        transition: .25s;
    }

    .icone-linkedin:hover {
        opacity: 1;
        background: rgba(250, 57, 122, 0.12);
    }

    .icone-linkedin svg {
        width: 18px;
        height: 18px;
    }

    @media (max-width: 600px) {
        .quiz-cabecalho h1 {
            font-size: 32px;
        }

        .quiz-card {
            padding: 22px;
        }

        .quiz-pergunta {
            font-size: 20px;
        }

        .quiz-fim-stats {
            gap: 10px;
        }

        .stat-item {
            min-width: 100px;
            padding: 14px 18px;
        }

const PONTOS_POR_ACERTO = 10;

// ----------------------------------------------------------
// 2. ESTADO DO QUIZ
// ----------------------------------------------------------
let categoriaAtual = "";       // categoria selecionada no filtro
let questoesFiltradas = [];    // perguntas da categoria atual
let indiceAtual = 0;           // pergunta atual dentro de questoesFiltradas
let acertosSessao = 0;         // acertos na rodada atual (reseta a cada categoria/refazer)

const cardQuiz = document.getElementById("quiz-card");
const areaCategorias = document.getElementById("quiz-categorias");

// ----------------------------------------------------------
// 3. CATEGORIAS
//    obterCategorias() lê todas as tags usadas em QUESTOES e
//    monta a lista de categorias automaticamente — é por isso
//    que uma tag nova em QUESTOES já vira categoria sem
//    precisar editar mais nada.
// ----------------------------------------------------------
function obterCategorias() {
    const tags = new Set();
    QUESTOES.forEach(questao => {
        questao.tags.forEach(tag => tags.add(tag));
    });
    return Array.from(tags).sort((a, b) => a.localeCompare(b, "pt-BR"));
}

function carregarCategorias() {
    const categorias = obterCategorias();

    areaCategorias.innerHTML = categorias
        .map(categoria => `
            <button
                class="categoria-filtro${categoria === categoriaAtual ? " ativa" : ""}"
                data-categoria="${categoria}"
            >${categoria}</button>
        `)
        .join("");

    document.querySelectorAll(".categoria-filtro").forEach(botao => {
        botao.addEventListener("click", () => {
            selecionarCategoria(botao.dataset.categoria);
        });
    });

    // nenhuma categoria escolhida ainda -> seleciona a primeira automaticamente
    if (!categoriaAtual && categorias.length > 0) {
        selecionarCategoria(categorias[0]);
    }
}

function selecionarCategoria(categoria) {
    categoriaAtual = categoria;

    document.querySelectorAll(".categoria-filtro").forEach(botao => {
        botao.classList.toggle("ativa", botao.dataset.categoria === categoria);
    });

    filtrarQuestoes(categoria);
    iniciarQuiz();
}

// ----------------------------------------------------------
// 4. FILTRAR QUESTÕES PELA CATEGORIA ESCOLHIDA
// ----------------------------------------------------------
function filtrarQuestoes(categoria) {
    questoesFiltradas = QUESTOES.filter(questao => questao.tags.includes(categoria));
}

// ----------------------------------------------------------
// 5. INICIAR / REINICIAR O QUIZ
// ----------------------------------------------------------
function iniciarQuiz() {
    indiceAtual = 0;
    acertosSessao = 0;
    renderizarPergunta();
}

// ----------------------------------------------------------
// 6. MONTA A PERGUNTA NA TELA
// ----------------------------------------------------------
function renderizarPergunta() {

    if (questoesFiltradas.length === 0) {
        cardQuiz.innerHTML = `
            <div class="quiz-fim">
                <h2>Ainda não tem perguntas aqui 😅</h2>
                <p>Essa categoria ainda não tem perguntas cadastradas. Escolha outra categoria no filtro acima.</p>
            </div>
        `;
        return;
    }

    if (indiceAtual >= questoesFiltradas.length) {
        finalizarQuiz();
        return;
    }

    const questao = questoesFiltradas[indiceAtual];
    const ultimaPergunta = indiceAtual === questoesFiltradas.length - 1;
    const textoBotao = ultimaPergunta ? "Finalizar quiz →" : "Próxima pergunta →";

    const tagsHtml = questao.tags.map(t => `<span class="quiz-tag">${t}</span>`).join("");

    const respostasHtml = questao.respostas
        .map((resposta, i) => `
            <button class="quiz-resposta" data-indice="${i}">${resposta}</button>
        `)
        .join("");

    cardQuiz.innerHTML = `
        <div class="quiz-tags">${tagsHtml}</div>
        <div class="quiz-pergunta">${questao.pergunta}</div>
        <div class="quiz-respostas">${respostasHtml}</div>
        <div class="quiz-feedback" id="quiz-feedback">${questao.explicacao}</div>
        <div class="quiz-rodape-card">
            <span class="quiz-progresso">Pergunta ${indiceAtual + 1} de ${questoesFiltradas.length}</span>
            <button class="botao-proxima" id="botao-proxima">${textoBotao}</button>
        </div>
    `;

    document.querySelectorAll(".quiz-resposta").forEach(botao => {
        botao.addEventListener("click", () => responderPergunta(botao, questao));
    });

    document.getElementById("botao-proxima").addEventListener("click", () => {
        indiceAtual++;
        renderizarPergunta();
    });
}

// ----------------------------------------------------------
// 7. RESPONDE A PERGUNTA (marca certo/errado)
// ----------------------------------------------------------
function responderPergunta(botaoClicado, questao) {
    const indiceEscolhido = Number(botaoClicado.dataset.indice);
    const acertou = indiceEscolhido === questao.correta;

    document.querySelectorAll(".quiz-resposta").forEach(botao => {
        botao.disabled = true;
        if (Number(botao.dataset.indice) === questao.correta) {
            botao.classList.add("correta");
        } else if (botao === botaoClicado) {
            botao.classList.add("errada");
        }
    });

    document.getElementById("quiz-feedback").classList.add("visivel");
    document.getElementById("botao-proxima").classList.add("visivel");

    if (acertou) {
        acertosSessao++;
    }
}

// ----------------------------------------------------------
// 8. TELA FINAL DO QUIZ (dessa categoria)
//    Mostra acertos, percentual e pontos da rodada, os botões
//    "Refazer" / "Escolher outra categoria" e, discreto embaixo,
//    o ícone de compartilhar no LinkedIn.
// ----------------------------------------------------------
function finalizarQuiz() {
    const total = questoesFiltradas.length;
    const percentual = total > 0 ? Math.round((acertosSessao / total) * 100) : 0;
    const pontosGanhos = acertosSessao * PONTOS_POR_ACERTO;

    cardQuiz.innerHTML = `
        <div class="quiz-fim">
            <h2>Quiz finalizado! 🎉</h2>
            <p>Categoria: <strong>${categoriaAtual}</strong></p>

            <div class="quiz-fim-stats">
                <div class="stat-item">
                    <span class="stat-numero">${acertosSessao}/${total}</span>
                    <span class="stat-legenda">Acertos</span>
                </div>
                <div class="stat-item">
                    <span class="stat-numero">${percentual}%</span>
                    <span class="stat-legenda">Aproveitamento</span>
                </div>
                <div class="stat-item">
                    <span class="stat-numero">${pontosGanhos}</span>
                    <span class="stat-legenda">Pontos ganhos</span>
                </div>
            </div>

            <div class="quiz-fim-botoes">
                <button class="botao-refazer" id="botao-refazer">Refazer</button>
                <button class="botao-outra-categoria" id="botao-outra-categoria">Escolher outra categoria</button>
            </div>

            <div class="compartilhar-linkedin-discreto">
                <button class="icone-linkedin" id="botao-linkedin-icone" title="Compartilhar no LinkedIn" aria-label="Compartilhar no LinkedIn">
                    <svg viewBox="0 0 24 24" fill="#FA397A">
                        <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.45-2.14 2.94v5.66H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/>
                    </svg>
                </button>
            </div>
        </div>
    `;

    document.getElementById("botao-refazer").addEventListener("click", iniciarQuiz);

    document.getElementById("botao-outra-categoria").addEventListener("click", () => {
        areaCategorias.scrollIntoView({ behavior: "smooth", block: "center" });
    });

    document.getElementById("botao-linkedin-icone").addEventListener("click", compartilharNoLinkedIn);
}

// ----------------------------------------------------------
// 9. COMPARTILHAR A PÁGINA DO QUIZ NO LINKEDIN
//    Abre a caixa de compartilhamento oficial do LinkedIn com
//    o link da própria página do quiz. O LinkedIn não permite
//    preencher o texto do post via URL (regra deles), então
//    quem for postar escreve o texto na hora.
// ----------------------------------------------------------
function compartilharNoLinkedIn() {
    const urlPagina = encodeURIComponent(window.location.href);
    const urlCompartilhamento = `https://www.linkedin.com/sharing/share-offsite/?url=${urlPagina}`;

    window.open(urlCompartilhamento, "_blank", "noopener,noreferrer,width=600,height=600");
}

// ----------------------------------------------------------
// 10. INICIALIZA A PÁGINA
//     carregarCategorias() já seleciona a primeira categoria
//     automaticamente e dispara o quiz.
// ----------------------------------------------------------
carregarCategorias();

</script>
